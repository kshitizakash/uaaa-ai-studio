<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAAA AI Studio - Script Studio</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101827;
 color:#fff;
}
header{
 background:#17243a;
 padding:18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:10px;
 border-bottom:1px solid #33445e;
}
header h2{margin:0;color:#55c5ff}
.container{max-width:1100px;margin:auto;padding:18px}
.card{
 background:#19263b;
 padding:18px;
 border-radius:12px;
 margin-bottom:18px;
 border:1px solid #30435e;
}
h3{margin-top:0;color:#61c8ff}
label{
 display:block;
 margin:12px 0 6px;
 font-size:14px;
 color:#cbd8e8;
}
input,select,textarea{
 width:100%;
 padding:12px;
 border-radius:7px;
 border:1px solid #405574;
 background:#0e1929;
 color:white;
 font-size:15px;
}
textarea{min-height:100px;resize:vertical}
button{
 border:0;
 padding:11px 15px;
 border-radius:7px;
 cursor:pointer;
 font-weight:bold;
 margin:4px 3px 4px 0;
}
.primary{background:#1689e8;color:white}
.success{background:#16a36a;color:white}
.danger{background:#d94b55;color:white}
.secondary{background:#405574;color:white}
.scene{
 background:#111e30;
 border:1px solid #405574;
 padding:15px;
 border-radius:10px;
 margin-bottom:14px;
}
.scene-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:10px;
}
.scene-header strong{color:#62caff}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}
.small{font-size:12px;color:#a9bdd4}
#status{color:#6ee7a8;font-size:13px}
.top-actions{display:flex;gap:6px;flex-wrap:wrap}
a{color:#66caff;text-decoration:none}
@media(max-width:600px){
 .container{padding:10px}
 .card{padding:13px}
 header{padding:14px}
 button{padding:10px}
}
</style>
</head>

<body>

<header>
 <h2>🎬 UAAA AI Studio</h2>
 <div class="top-actions">
  <button class="secondary" onclick="location.href='index.html'">Dashboard</button>
  <button class="secondary" onclick="location.href='projects.html'">My Projects</button>
 </div>
</header>

<div class="container">

<div class="card">
 <h3>📝 Script Studio V1.0</h3>
 <p class="small">Create, write and organize your video script scene by scene.</p>

 <label>Project Name</label>
 <input id="projectName" placeholder="Enter project name">

 <label>Video Topic</label>
 <input id="topic" placeholder="Enter your video topic">

 <label>Video Category</label>
 <select id="category">
  <option>News</option>
  <option>Education</option>
  <option>Motivation</option>
  <option>Story</option>
  <option>Documentary</option>
  <option>Facts</option>
  <option>Job Alerts</option>
  <option>Entertainment</option>
  <option>Product Promotion</option>
  <option>YouTube Shorts</option>
  <option>Other</option>
 </select>

 <label>Video Language</label>
 <select id="language">
  <option>Hindi</option>
  <option>English</option>
  <option>Bhojpuri</option>
  <option>Bengali</option>
  <option>Marathi</option>
  <option>Tamil</option>
  <option>Telugu</option>
  <option>Other</option>
 </select>

 <label>Video Format</label>
 <select id="format">
  <option value="16:9">Landscape (16:9)</option>
  <option value="9:16">Portrait / Shorts (9:16)</option>
  <option value="1:1">Square (1:1)</option>
 </select>

 <label>Project Description</label>
 <textarea id="description" placeholder="Describe your video project..."></textarea>
</div>

<div class="card">
 <h3>🎞️ Scene Management</h3>
 <div class="actions">
  <button class="success" onclick="addScene()">+ Add New Scene</button>
  <button class="primary" onclick="saveProject()">💾 Save Project</button>
 </div>
 <p id="status">Ready to create your script.</p>
 <div id="sceneList"></div>
 <button class="success" onclick="addScene()">+ Add Another Scene</button>
</div>

<div class="card">
 <h3>📊 Script Summary</h3>
 <p>Total Scenes: <strong id="totalScenes">0</strong></p>
 <p>Total Words: <strong id="totalWords">0</strong></p>
 <p>Estimated Voice Duration: <strong id="duration">0 sec</strong></p>
 <button class="primary" onclick="saveProject()">Save Script</button>
 <button class="secondary" onclick="location.href='editor.html'">Open Video Editor</button>
</div>

</div>

<script>
const STORAGE_KEY = "uaaaProjects";

let scenes = [];
let currentProjectId = null;
let autosaveTimer = null;

const $ = id => document.getElementById(id);

function makeId(){
 return "uaaa_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[c]);
}

function getProjects(){
 try{
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  return Array.isArray(data) ? data : [];
 }catch(e){
  return [];
 }
}

function setStatus(message){
 $("status").textContent = message;
}

function addScene(){
 scenes.push({
  id:makeId(),
  dialogue:"",
  visual:"",
  subtitle:"",
  duration:5
 });
 renderScenes();
 scheduleAutosave();
}

function deleteScene(index){
 if(scenes.length <= 1){
  alert("कम से कम एक Scene रखना जरूरी है।");
  return;
 }
 if(!confirm("क्या आप यह Scene Delete करना चाहते हैं?")) return;
 scenes.splice(index,1);
 renderScenes();
 scheduleAutosave();
}

function moveScene(index,direction){
 const newIndex = index + direction;
 if(newIndex < 0 || newIndex >= scenes.length) return;

 const temp = scenes[index];
 scenes[index] = scenes[newIndex];
 scenes[newIndex] = temp;

 renderScenes();
 scheduleAutosave();
}

function duplicateScene(index){
 const copy = JSON.parse(JSON.stringify(scenes[index]));
 copy.id = makeId();
 scenes.splice(index+1,0,copy);
 renderScenes();
 scheduleAutosave();
}

function updateScene(index,field,value){
 scenes[index][field] = value;
 updateSummary();
 scheduleAutosave();
}

function renderScenes(){
 const box = $("sceneList");
 box.innerHTML = "";

 scenes.forEach((scene,index)=>{
  const div = document.createElement("div");
  div.className = "scene";

  div.innerHTML = `
   <div class="scene-header">
    <strong>SCENE ${index+1}</strong>
    <div class="actions">
     <button class="secondary" onclick="moveScene(${index},-1)">↑ Up</button>
     <button class="secondary" onclick="moveScene(${index},1)">↓ Down</button>
     <button class="secondary" onclick="duplicateScene(${index})">Duplicate</button>
     <button class="danger" onclick="deleteScene(${index})">Delete</button>
    </div>
   </div>

   <label>Scene Dialogue / Voice Script</label>
   <textarea
    placeholder="यहाँ इस Scene का Dialogue लिखें..."
    oninput="updateScene(${index},'dialogue',this.value)"
   >${escapeHTML(scene.dialogue)}</textarea>

   <label>Visual Description</label>
   <textarea
    placeholder="इस Scene में क्या दिखाई देना चाहिए?"
    oninput="updateScene(${index},'visual',this.value)"
   >${escapeHTML(scene.visual)}</textarea>

   <label>Subtitle Text</label>
   <input
    value="${escapeHTML(scene.subtitle)}"
    placeholder="Subtitle लिखें..."
    oninput="updateScene(${index},'subtitle',this.value)"
   >

   <label>Estimated Scene Duration (Seconds)</label>
   <input
    type="number"
    min="1"
    max="600"
    value="${Number(scene.duration) || 5}"
    oninput="updateScene(${index},'duration',Math.max(1,Number(this.value)||1))"
   >
  `;

  box.appendChild(div);
 });

 updateSummary();
}

function updateSummary(){
 $("totalScenes").textContent = scenes.length;

 let words = 0;
 let seconds = 0;

 scenes.forEach(scene=>{
  words += (scene.dialogue.trim().match(/\S+/g) || []).length;
  seconds += Number(scene.duration) || 0;
 });

 $("totalWords").textContent = words;

 const estimated = Math.round(words / 2.5);
 $("duration").textContent =
  Math.max(seconds,estimated) + " sec (estimated)";
}

function collectProject(){
 const now = new Date().toISOString();

 return {
  id:currentProjectId || makeId(),
  name:$("projectName").value.trim() || "Untitled Project",
  title:$("projectName").value.trim() || "Untitled Project",
  topic:$("topic").value.trim(),
  category:$("category").value,
  language:$("language").value,
  format:$("format").value,
  description:$("description").value,
  dialogues:scenes.map((scene,index)=>({
   sceneIndex:index,
   text:scene.dialogue
  })),
  visuals:scenes.map((scene,index)=>({
   sceneIndex:index,
   description:scene.visual,
   subtitle:scene.subtitle
  })),
  timeline:scenes.map((scene,index)=>({
   sceneIndex:index,
   duration:Number(scene.duration)||5
  })),
  scenes:JSON.parse(JSON.stringify(scenes)),
  updatedAt:now
 };
}

function saveProject(){
 const name = $("projectName").value.trim();

 if(!name){
  alert("Please enter Project Name.");
  $("projectName").focus();
  return;
 }

 if(scenes.length === 0){
  alert("Please add at least one Scene.");
  return;
 }

 const project = collectProject();
 const projects = getProjects();

 const existingIndex = projects.findIndex(
  p => String(p.id) === String(project.id)
 );

 if(existingIndex >= 0){
  projects[existingIndex] = {
   ...projects[existingIndex],
   ...project
  };
 }else{
  projects.unshift(project);
 }

 currentProjectId = project.id;

 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));
  setStatus("✅ Project saved successfully!");
 }catch(error){
  setStatus("❌ Save failed. Browser storage may be full.");
  alert("Project save नहीं हो पाया। Browser storage check करें।");
 }
}

function scheduleAutosave(){
 clearTimeout(autosaveTimer);
 setStatus("Changes detected. Auto-save pending...");

 autosaveTimer = setTimeout(()=>{
  const name = $("projectName").value.trim();
  if(!name) return;

  saveProject();
  setStatus("✅ Auto-saved successfully.");
 },1200);
}

function loadProject(project){
 currentProjectId = project.id;

 $("projectName").value = project.name || project.title || "";
 $("topic").value = project.topic || "";
 $("category").value = project.category || "News";
 $("language").value = project.language || "Hindi";
 $("format").value = project.format || "16:9";
 $("description").value = project.description || "";

 if(Array.isArray(project.scenes) && project.scenes.length){
  scenes = project.scenes.map(scene=>({
   id:scene.id || makeId(),
   dialogue:scene.dialogue || "",
   visual:scene.visual || "",
   subtitle:scene.subtitle || "",
   duration:Number(scene.duration)||5
  }));
 }else{
  const dialogues = project.dialogues || [];
  const visuals = project.visuals || [];
  const timeline = project.timeline || [];

  const count = Math.max(
   dialogues.length,
   visuals.length,
   timeline.length,
   1
  );

  scenes = Array.from({length:count},(_,index)=>({
   id:makeId(),
   dialogue:dialogues[index]?.text || "",
   visual:visuals[index]?.description || "",
   subtitle:visuals[index]?.subtitle || "",
   duration:Number(timeline[index]?.duration)||5
  }));
 }

 renderScenes();
 setStatus("Existing project loaded.");
}

function loadExistingProjects(){
 const projects = getProjects();

 if(!projects.length) return;

 const choice = confirm(
  "क्या आप पहले से सेव किया हुआ Project खोलना चाहते हैं?"
 );

 if(!choice) return;

 const list = projects.map((p,index)=>
  (index+1)+". "+(p.name || p.title || "Untitled")
 ).join("\n");

 const answer = prompt(
  "Project का नंबर लिखें:\n"+list
 );

 const index = Number(answer)-1;

 if(index >= 0 && index < projects.length){
  loadProject(projects[index]);
 }
}

["projectName","topic","category","language","format","description"]
.forEach(id=>{
 $(id).addEventListener("input",scheduleAutosave);
 $(id).addEventListener("change",scheduleAutosave);
});

function init(){
 const params = new URLSearchParams(location.search);
 const requestedId = params.get("id");

 const projects = getProjects();

 if(requestedId){
  const project = projects.find(p=>String(p.id)===requestedId);
  if(project){
   loadProject(project);
   return;
  }
 }

 scenes = [{
  id:makeId(),
  dialogue:"",
  visual:"",
  subtitle:"",
  duration:5
 }];

 renderScenes();

 if(projects.length){
  setStatus("New project ready. You can also load an existing project.");
  setTimeout(loadExistingProjects,300);
 }
}

init();
</script>

</body>
</html>
